name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify dependency consistency
        run: pip check

      - name: Create dummy .env
        run: |
          cat > .env <<EOF
          LLM_API_KEY=sk-test-dummy
          LLM_BASE_URL=https://api.openai.com/v1
          LLM_MODEL=gpt-4o-mini
          LOG_LEVEL=WARNING
          EOF

      - name: Run pytest
        run: pytest -v --tb=short

  lint:
    name: ruff + 契约一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: ruff check . --output-format=github

      # 事件名是前后端唯一契约，events.js 必须能从 core/events.py 原样生成。
      # 手改 events.js 或只改一端，这一步会红。
      - name: 事件契约（events.js 与 core/events.py 同源）
        run: python scripts/gen_events_js.py --check

      # requirements.txt 的上下界必须能被当前解释器解析（防止写成非法版本号）
      - name: 依赖声明可解析
        run: python -m pip install --dry-run -r requirements.txt

      # 棘轮：except Exception 只能减少不能增加。清理一处后跑 --update 下调基线。
      - name: 异常处理棘轮
        run: python scripts/check_except_baseline.py
