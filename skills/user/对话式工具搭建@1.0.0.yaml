id: skill_99bd2f50ef
name: 对话式工具搭建
version: 1.0.0
capability: 用户要一套工具让你能对话式做事时，怎么拆、怎么验、怎么交付
method: 遇到『帮我写些工具，让我能对话式做某件事』这类请求，先拆场景再动手，不要边想边写。先按业务环节列出缺哪些能力，每项定义一个工具：它解决什么、需要什么参数、为什么需要；关键判断是——工具不是越多越好，能覆盖用户说的那个闭环就行，别把一次性需求也做成工具。踩过的坑是工具建好后不验证就交付，用户对着对话一用就报错；所以每个工具都要实际调用一次，确认参数和返回符合预期，跑不通就当场修或删。完成标准是：工具集能被独立调用成功，且用户知道每个工具在什么场景用。交付时把工具说明和使用场景一起给，而不是只丢一堆代码。
patterns:
- 帮我写几个工具
- 对话式做某件事
- 搭一个助手
- 写工具让我能用
- 做一套能聊天操作的工具
- 本地就能用
