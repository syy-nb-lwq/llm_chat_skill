id: skill_42d0910774
name: 视频产物可靠交付
version: 1.0.0
capability: 视频/媒体产物生成后如何可靠交付，避免误报完成
method: 视频类任务有三个独立的失败面，必须逐个确认，不能把『脚本跑完』当成『交付完成』。第一，产物层：生成成功提示不等于产物可用，要把产物重新读回、核对内容，读不回就是内容本身有问题。第二，发布层：发布失败先分辨是产物不合格（路径、格式、内容）还是调用偶发失败——看起来该直接重试，其实前者回去改内容重试也没用，后者才该直接重试同名发布，不要因为一次失败就终止任务。第三，状态层：用户说『充值好了』『额度到了』只恢复执行条件，不会自动替换之前失败的产物，必须重新生成并取回验证，拿旧的失败产物凑数等于没做。完成标准是产物可读回、内容核对一致、发布返回成功三件事同时成立，缺任何一项都不算交付。阶段性产物要尽早交付成可检验对象，而不是全部做完再一次性给出。
patterns:
- 视频还没交付
- 生成并发布视频
- 充值后重新生成
- 发布失败了怎么办
- 把视频发给我
- 额度到了再跑一次
