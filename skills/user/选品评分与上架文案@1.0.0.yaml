id: skill_8c1927e533
name: 选品评分与上架文案
version: 1.0.0
capability: 用评分维度筛选候选商品，再产出可上架的商品信息
method: 选品不是凭感觉挑，要把判断拆成可核对的维度再下结论。先按成本、售价、佣金、广告费、运费、退货率、竞争度、热度逐项测算候选商品，判断标准是综合利润空间和结构，不能只看热度高就上——这是最常见的坑。筛出的商品再结合关键词和使用场景产出上架文案与商品信息。如果一次给多个候选，要逐个打分、分别给结论，不要混成一句笼统建议。完成标准是：每个候选都有可追溯的评分依据，且筛出的品能直接拿去上架，缺任何一项都不算做完。
patterns:
- 帮我选品
- 给商品打分
- 选品并上架
- 生成上架信息
- 这个商品能上架吗
- 批量选品
